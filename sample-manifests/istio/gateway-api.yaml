apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: store-front-gateway
  namespace: pets
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: store-front
  namespace: pets
spec:
  parentRefs:
    - name: store-front-gateway
  rules:
    - backendRefs:
        - name: store-front
          port: 80
