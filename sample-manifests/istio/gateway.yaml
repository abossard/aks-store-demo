apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: store-front-gateway-external
  namespace: pets
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: store-front-route-external
  namespace: pets
spec:
  parentRefs:
    - name: store-front-gateway-external
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: store-front
          port: 80
