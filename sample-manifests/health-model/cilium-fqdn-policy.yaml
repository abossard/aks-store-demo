apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: health-model-dns
  labels:
    app.kubernetes.io/managed-by: ahm-for-k8s
    minime.virtucon.io/owned-by: ahm-for-k8s-live-smoke
    minime.virtucon.io/sample: health-model
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: health-model-dns-probe
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: __DNS_PROBE_NAME__
    - toFQDNs:
        - matchName: __DNS_PROBE_NAME__
