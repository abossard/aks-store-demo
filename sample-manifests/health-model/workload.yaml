apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: health-model-data
  labels:
    app.kubernetes.io/managed-by: ahm-for-k8s
    minime.virtucon.io/owned-by: ahm-for-k8s-live-smoke
    minime.virtucon.io/sample: health-model
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: __STORAGE_CLASS__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-model-backend
  labels:
    app.kubernetes.io/managed-by: ahm-for-k8s
    minime.virtucon.io/owned-by: ahm-for-k8s-live-smoke
    minime.virtucon.io/sample: health-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: health-model-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-model-backend
        minime.virtucon.io/route: health-model-backend
        minime.virtucon.io/sample: health-model
    spec:
      containers:
        - name: backend
          image: ghcr.io/azure-samples/aks-store-demo/store-front:2.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/health-model-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: health-model-data
---
apiVersion: v1
kind: Service
metadata:
  name: health-model-backend
  labels:
    app.kubernetes.io/managed-by: ahm-for-k8s
    minime.virtucon.io/owned-by: ahm-for-k8s-live-smoke
    minime.virtucon.io/sample: health-model
spec:
  type: ClusterIP
  selector:
    minime.virtucon.io/route: health-model-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: health-model-backend
  labels:
    app.kubernetes.io/managed-by: ahm-for-k8s
    minime.virtucon.io/owned-by: ahm-for-k8s-live-smoke
    minime.virtucon.io/sample: health-model
spec:
  minReplicas: 1
  maxReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: health-model-backend
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
